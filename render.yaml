services:
  # PostgreSQL Database
  - type: pserv
    name: qrpipay-db
    plan: free
    region: frankfurt
    ipAllowList: []
    
  # Backend API Service
  - type: web
    name: qrpipay-backend
    env: node
    plan: free
    region: frankfurt
    repo: https://github.com/PORTRAITART1/QRPiPay.git
    branch: master
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: qrpipay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://qrpipay-frontend.onrender.com
      - key: PI_API_KEY
        value: ""
      - key: PI_API_URL
        value: https://api.minepi.com
      - key: PI_APP_ID
        value: ""
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LOG_LEVEL
        value: info
      - key: DB_USER
        value: qrpipay
      - key: DB_PASSWORD
        fromDatabase:
          name: qrpipay-db
          property: password
      - key: DB_NAME
        value: qrpipay
      - key: DB_HOST
        fromDatabase:
          name: qrpipay-db
          property: host
      - key: DB_PORT
        value: "5432"

  # Frontend Web Application
  - type: web
    name: qrpipay-frontend
    env: node
    plan: free
    region: frankfurt
    repo: https://github.com/PORTRAITART1/QRPiPay.git
    branch: master
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        value: https://qrpipay-backend.onrender.com/api
