services:
  # Backend Service - Using Dockerfile
  - type: web
    name: qrpipay-backend
    dockerfile: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: qrpipay-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://qrpipay.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # Frontend Service - Using Dockerfile
  - type: web
    name: qrpipay-frontend
    dockerfile: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: https://qrpipay-backend.onrender.com/api
      - key: VITE_PI_APP_ID
        sync: false

# Database
databases:
  - name: qrpipay-db
    databaseName: qrpipay
    user: qrpipay
    plan: free
    version: 15
    region: oregon
