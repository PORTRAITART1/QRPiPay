services:
  # Backend Service
  - type: web
    name: qrpipay-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: qrpipay-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://qrpipay.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # Frontend Service
  - type: static
    name: qrpipay-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://qrpipay-backend.onrender.com/api
      - key: VITE_PI_APP_ID
        sync: false

# Database
databases:
  - name: qrpipay-db
    databaseName: qrpipay
    user: qrpipay
    plan: free
    version: 15
    region: oregon
