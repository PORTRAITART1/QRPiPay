services:
  # PostgreSQL Database
  - type: pserv
    name: qrpipay-db
    env: docker
    plan: free
    region: frankfurt
    repo: https://github.com/PORTRAITART1/QRPiPay.git
    dockerCommand: docker run -e POSTGRES_USER=qrpipay -e POSTGRES_PASSWORD=$DB_PASSWORD -e POSTGRES_DB=qrpipay -p 5432:5432 postgres:15-alpine
    envVars:
      - key: POSTGRES_USER
        value: qrpipay
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: qrpipay

  # Backend API Service
  - type: web
    name: qrpipay-backend
    env: node
    plan: free
    region: frankfurt
    repo: https://github.com/PORTRAITART1/QRPiPay.git
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: node src/server.js
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://qrpipay-frontend.onrender.com
      - key: PI_API_KEY
        value: ""
      - key: PI_API_URL
        value: https://api.minepi.com
      - key: PI_APP_ID
        value: ""
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LOG_LEVEL
        value: info
      - key: DB_USER
        value: qrpipay
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: qrpipay
      - key: DB_HOST
        value: qrpipay-db
      - key: DB_PORT
        value: "5432"

  # Frontend Web Application
  - type: static_site
    name: qrpipay-frontend
    env: static
    plan: free
    region: frankfurt
    repo: https://github.com/PORTRAITART1/QRPiPay.git
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishPath: dist
    
    envVars:
      - key: VITE_API_URL
        value: https://qrpipay-backend.onrender.com/api
