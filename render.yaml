services:
  # Backend Service - Using Native Node.js (NO DOCKER)
  - type: web
    name: qrpipay-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: qrpipay-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://qrpipay.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # Frontend Service - Using Native Node.js (NO DOCKER)
  - type: web
    name: qrpipay-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm install -g serve && serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        value: https://qrpipay-backend.onrender.com/api
      - key: VITE_PI_APP_ID
        sync: false

# Database
databases:
  - name: qrpipay-db
    databaseName: qrpipay
    user: qrpipay
    plan: free
    version: 15
    region: oregon
